<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <meta name="description" content="点一下，让拥挤慢慢散开。一款操作简单、反馈轻快的清空小游戏。">
  <title>空一点 · 清空小游戏</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=18">
  <link rel="stylesheet" href="cube-view.css?v=18">
  <link rel="stylesheet" href="round-view.css?v=18">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 23V9h14M14 23h11V12M7 23l18-18M18 5h7v7"/></svg><span>空一点</span></div>
      <button class="icon-button" id="sound" aria-label="开启声音" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-off" d="m16 9 6 6m0-6-6 6"/><path class="sound-on" d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button>
    </header>
    <p class="intro" id="intro">找一条出路，慢慢清空。</p>
    <section class="play-area" aria-label="清空小游戏">
      <div class="play-modes" role="group" aria-label="选择玩法"><button id="mode-cube" aria-pressed="false">立体找箭头</button><button id="mode-search" aria-pressed="true">密线找箭头</button><button id="mode-classic" aria-pressed="false">原版 100 关</button></div>
      <div class="level-meta"><button id="level-open" class="level-button" aria-haspopup="dialog"><span id="level-label">第 01 关</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button><span id="count">准备好了</span></div>
      <div class="board-controls"><span id="board-guide">点箭头任意一段。</span><button id="zoom" class="zoom-button" aria-pressed="false" aria-controls="board-viewport"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m14.5 14.5 5 5M7 10h6m-3-3v6"/></svg><span id="zoom-label">放大棋盘</span></button></div>
      <div class="board-wrap" id="board-wrap"><div class="board-viewport" id="board-viewport" aria-describedby="board-guide"><div class="board-surface" id="board-surface"><canvas id="board" aria-hidden="true"></canvas><div id="pieces" role="group" aria-label="点箭头任意一段，让它沿方向离开"></div></div></div><div id="cube-stage" hidden aria-label="可旋转的六面箭头立方体"></div><div id="finish" class="finish" hidden><svg viewBox="0 0 60 60" aria-hidden="true"><path d="m17 30 9 9 17-20"/></svg><h1 id="finish-title">空出来了。</h1><p id="finish-copy">留一点空，刚刚好。</p><button id="next" class="primary-button">再来一关<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div></div>
      <div class="cube-controls" id="cube-controls" hidden><button id="cube-prev" aria-label="查看上一面"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>上一面</button><button id="cube-reset">复位视角</button><button id="cube-next" aria-label="查看下一面">下一面<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></div>
      <div class="feedback-line"><span id="feedback" role="status" aria-live="polite">顺着箭头，把小块移出去。</span></div>
      <div class="tools"><button id="undo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4-5 5 5 5M3 9h10a7 7 0 0 1 0 14" transform="translate(0 -2) scale(1 .85)"/></svg><span>撤回一步</span></button><button id="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16c0-2-3-3-3-7a7 7 0 0 1 14 0c0 4-3 5-3 7M8 16h8M9 20h6"/></svg><span>给点提示</span></button><button id="restart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 1 1 1 6M4 4v7h7"/></svg><span>重新开始</span></button></div>
    </section>
    <footer class="game-footer"><span id="level-name">轻轻开始</span><span id="pace-note">不限次数，误点没关系。</span></footer>
  </main>
  <dialog id="level-dialog" aria-labelledby="level-dialog-title"><div class="dialog-top"><h2 id="level-dialog-title">选一关，慢慢玩。</h2><button id="level-close" class="icon-button" aria-label="关闭关卡选择"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="level-grid"></div><p>每一关都可以直接开始。</p></dialog>
  <script type="module" src="app.js?v=18"></script>
</body>
</html>
